name: Sabagiro
options:
  bundleIdPrefix: ge.sabagiro
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    # Set your Apple ID team in Xcode → Signing (do not commit personal team id)
    DEVELOPMENT_TEAM: "R85UAY2KY6"
    CODE_SIGN_STYLE: Automatic
targets:
  Sabagiro:
    type: application
    platform: iOS
    sources:
      - path: Sabagiro
        excludes:
          - "**/*.md"
    resources:
      - Sabagiro/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ge.sabagiro.app
        INFOPLIST_KEY_CFBundleDisplayName: Sabagiro
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: true
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: PassKit.framework
    info:
      path: Sabagiro/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Sabagiro
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Sabagiro saves your ticket image to Photos when you tap Save to Photos.
        UIBackgroundModes: []
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
